server:
  port: ${PORT:8080}
  tomcat:
    accesslog:
      enabled: false

spring:
  application:
    name: AptisEsol

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/aptis_esol?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=utf8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:demo123}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-minutes: ${JWT_ACCESS_MINUTES:60}
    refresh-token-days: ${JWT_REFRESH_DAYS:14}

  upload-dir: ${UPLOAD_DIR:uploads}
  cors: ${APP_CORS:http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  mail:
    enabled: ${MAIL_ENABLED:true}
    verification-token-hours: ${MAIL_VERIFY_HOURS:24}
    gas-url: ${GAS_MAIL_URL:}
    gas-secret: ${GAS_MAIL_SECRET:}

  subscription:
    free-trial-days: ${FREE_TRIAL_DAYS:1}

  seed:
    admin-email: ${SEED_ADMIN_EMAIL:admin@aptis.com}
    admin-password: ${SEED_ADMIN_PASSWORD:}
    student-email: ${SEED_STUDENT_EMAIL:student@aptis.com}
    student-password: ${SEED_STUDENT_PASSWORD:}

  payment:
    bank-id: ${PAYMENT_BANK_ID:}
    account-no: ${PAYMENT_ACCOUNT_NO:}
    account-name: ${PAYMENT_ACCOUNT_NAME:}
    sepay-webhook-token: ${SEPAY_WEBHOOK_TOKEN:}

  ai:
    deepseek-api-key: ${DEEPSEEK_API_KEY:${OPENAI_API_KEY:}}
    deepseek-model: ${DEEPSEEK_MODEL:deepseek-chat}
    deepseek-base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    openai-api-key: ${OPENAI_API_KEY:}
    openai-model: ${OPENAI_MODEL:gpt-4o-mini}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: WARN
    com.example.aptis: WARN
    com.example.aptis.service.EmailService: ERROR
    org.springframework: WARN
    org.springframework.web: ERROR
    org.springframework.security: ERROR
    org.hibernate: ERROR
    org.hibernate.SQL: ERROR
    org.hibernate.orm.jdbc.bind: ERROR
    org.hibernate.type.descriptor.sql: ERROR
    com.zaxxer.hikari: WARN
